<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Further details – Lithopanspermia</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2215%22%20fill%3D%22%233a2b24%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%226%22%20fill%3D%22%232ba3ab%22/%3E%3C/svg%3E">
  <style>
    @import url("./src/ui/theme.css");
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Aliases onto the one token set in ui/theme.css, imported above.
     *
     * This page kept an independent palette through the whole light-theme
     * migration, so it was still rendering on var(--bg-void) - a blue-black ground -
     * with blue-white headings, while every other page had moved to paper. Two
     * pages of one project were literally different colours. The names are
     * kept so the rest of this stylesheet is untouched; only their sources
     * change. --accent2 was --warn, which meant a warning colour carried the
     * page title and every link. */
    :root {
      --bg:      var(--bg-void);
      --surface: var(--bg-panel);
      --border:  var(--line-edge);
      --accent:  var(--accent);
      --accent2: var(--accent);
      --text:    var(--ink);
      --muted:   var(--ink-dim);
      --heading: var(--ink-bright);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, var(--ink) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 80%, #ccf 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 90%, #aaf 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 50%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 75%, #ccf 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-family: monospace;
      font-size: 15px;
      color: var(--accent2);
      letter-spacing: 0.08em;
      font-weight: bold;
    }

    .btn-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: monospace;
      font-size: 13px;
      padding: 5px 16px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s, background .2s;
    }
    .btn-back:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 60px 40px 100px;
    }

    .page-tag {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--heading);
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .lead {
      font-size: 1.15rem;
      color: var(--ink-dim);
      margin-bottom: 48px;
      max-width: 640px;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--accent2);
      font-weight: 600;
      margin: 48px 0 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 600;
      margin: 28px 0 10px;
    }

    p {
      margin-bottom: 16px;
      color: var(--text);
    }

    ul, ol {
      margin: 12px 0 20px 24px;
      color: var(--text);
    }

    li { margin-bottom: 6px; }

    code {
      font-family: monospace;
      font-size: 0.88em;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 3px;
    }

    blockquote {
      border-left: 3px solid var(--accent);
      margin: 24px 0;
      padding: 12px 20px;
      background: var(--accent-glow);
      border-radius: 0 6px 6px 0;
      color: var(--ink-dim);
      font-style: italic;
    }

    .formula {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 24px;
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
      margin: 20px 0;
      overflow-x: auto;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <span class="header-title">LITHOPANSPERMIA &middot; FURTHER DETAILS</span>
    <a href="./research.html" class="btn-back">← Back to research</a>
  </header>

  <main>
    <p class="page-tag">further details</p>
    <h1>Further Details</h1>
    <p class="lead">
      Content coming soon.
    </p>
  </main>

  <footer>
    Lithopanspermia Digital Twin &mdash; Hack4Sages &mdash; 2026
  </footer>

</body>
</html>
